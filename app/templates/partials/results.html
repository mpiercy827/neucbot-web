<div x-show="result" class="card">
  <div class="card-header">Results</div>
  <div class="card-body">
    <div class="row g-3 mb-4">
      <div class="col-sm-6">
        <div class="bg-light rounded p-3">
          <div class="text-secondary small">Total Neutron Yield (n/decay)</div>
          <div class="font-monospace fs-5" x-text="result?.total_neutron_yield?.toExponential(4)"></div>
        </div>
      </div>
      <div class="col-sm-6">
        <div class="bg-light rounded p-3">
          <div class="text-secondary small">Spectrum Integral (n/decay)</div>
          <div class="font-monospace fs-5" x-text="result?.spectrum_integral?.toExponential(4)"></div>
        </div>
      </div>
    </div>
    <div class="mb-4">
      <h6 class="border-bottom pb-2 mb-2">Neutron Energy Spectrum</h6>
      <canvas x-ref="spectrumChart"></canvas>
    </div>
    <div class="row">
      <div class="col-md-6">
        <h6 class="border-bottom pb-2 mb-2">Isotope Contributions</h6>
        <table class="table table-sm table-hover">
          <thead><tr><th>Isotope</th><th>Yield (n/decay)</th></tr></thead>
          <tbody>
            <template x-for="[isotope, value] in Object.entries(result?.isotope_contributions ?? {})">
              <tr>
                <td x-text="isotope"></td>
                <td class="font-monospace" x-text="value.toExponential(4)"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <div class="col-md-6">
        <h6 class="border-bottom pb-2 mb-2">Neutron Spectrum</h6>
        <div style="max-height: 300px; overflow-y: auto;">
          <table class="table table-sm table-hover">
            <thead><tr><th>Energy (keV)</th><th>Yield (n/decay)</th></tr></thead>
            <tbody>
              <template x-for="[energy, value] in Object.entries(result?.neutron_spectrum ?? {})">
                <tr>
                  <td class="font-monospace" x-text="energy"></td>
                  <td class="font-monospace" x-text="value.toExponential(4)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
