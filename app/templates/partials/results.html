<div x-show="result" class="card">
  <div class="card-header">Results</div>
  <div class="card-body">
    <dl class="row mb-3">
      <dt class="col-sm-5">Total Neutron Yield (n/decay)</dt>
      <dd class="col-sm-7 font-monospace" x-text="result?.total_neutron_yield?.toExponential(4)"></dd>
      <dt class="col-sm-5">Spectrum Integral (n/decay)</dt>
      <dd class="col-sm-7 font-monospace" x-text="result?.spectrum_integral?.toExponential(4)"></dd>
    </dl>
    <h6>Isotope Contributions</h6>
    <table class="table table-sm table-hover">
      <thead><tr><th>Isotope</th><th>Yield (n/decay)</th></tr></thead>
      <tbody>
        <template x-for="[isotope, value] in Object.entries(result?.isotope_contributions ?? {})">
          <tr>
            <td x-text="isotope"></td>
            <td class="font-monospace" x-text="value.toExponential(4)"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
