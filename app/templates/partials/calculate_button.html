<button class="btn btn-primary mb-3" type="button" @click="calculate()" :disabled="loading">
  <span x-show="loading" class="spinner-border spinner-border-sm me-1"></span>
  <span x-text="loading ? 'Calculating…' : 'Calculate'"></span>
</button>
<div x-show="error" class="alert alert-danger mb-3" x-text="error"></div>
