<div class="card mb-3">
  <div class="card-header d-flex justify-content-between align-items-center">
    Alpha Source
    <div class="btn-group btn-group-sm">
      <button type="button" class="btn"
              :class="mode === 'preloaded' ? 'btn-primary' : 'btn-outline-primary'"
              @click="mode = 'preloaded'">Preloaded</button>
      <button type="button" class="btn"
              :class="mode === 'custom' ? 'btn-primary' : 'btn-outline-primary'"
              @click="mode = 'custom'">Custom</button>
    </div>
  </div>
  <div class="card-body">
    <div x-show="mode === 'preloaded'">
      <select class="form-select" x-model="element" :disabled="availableElements.length === 0">
        <option value="" disabled x-show="availableElements.length === 0">Loading…</option>
        <template x-for="el in availableElements" :key="el">
          <option :value="el" x-text="el"></option>
        </template>
      </select>
    </div>
    <div x-show="mode === 'custom'">
      <div class="row text-secondary small fw-medium mb-1 px-1">
        <div class="col-5">Energy (MeV)</div>
        <div class="col">Probability (%)</div>
      </div>
      <template x-for="(a, i) in customAlphas" :key="i">
        <div class="row mb-2">
          <div class="col-5">
            <input class="form-control form-control-sm" type="number" step="0.0001"
                   x-model.number="a.energy" placeholder="6.7783">
          </div>
          <div class="col">
            <input class="form-control form-control-sm" type="number" step="0.0001"
                   x-model.number="a.probability" placeholder="99.998">
          </div>
          <div class="col-auto">
            <button class="btn btn-sm btn-outline-danger" type="button"
                    @click="customAlphas.splice(i, 1)" x-show="customAlphas.length > 1">&times;</button>
          </div>
        </div>
      </template>
      <button class="btn btn-sm btn-outline-secondary" type="button"
              @click="customAlphas.push({ energy: '', probability: '' })">+ Add Alpha</button>
    </div>
  </div>
</div>
